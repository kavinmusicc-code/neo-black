<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neo Black | Official</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #080808;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 40px;
            background: rgba(20, 20, 20, 0.8);
            border: 1px solid #222;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        h1 {
            font-size: 2.2rem;
            margin-bottom: 15px;
            letter-spacing: 1px;
            color: #ffffff;
        }
        p {
            color: #888888;
            font-size: 1rem;
            line-height: 1.6;
        }
        .badge {
            display: inline-block;
            margin-top: 25px;
            padding: 8px 16px;
            background-color: #1a1a1a;
            color: #00ffcc;
            border: 1px solid #333;
            border-radius: 20px;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Neo Black</h1>
        <p>Welcome to the official platform. High-performance design deployed seamlessly via GitHub Pages.</p>
        <div class="badge">System Online</div>
    </div>
</body>
</html>
