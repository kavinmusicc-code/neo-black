<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neo Black | Premium Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #0b0b0b;
            color: #ffffff;
            padding-bottom: 40px;
        }
        header {
            background-color: #141414;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #222;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo {
            font-size: 1.4rem;
            font-weight: bold;
            color: #ff0055;
            letter-spacing: 1px;
        }
        .nav-links a {
            color: #aaa;
            text-decoration: none;
            margin-left: 15px;
            font-size: 0.9rem;
        }
        .categories {
            display: flex;
            gap: 10px;
            padding: 15px 20px;
            overflow-x: auto;
            border-bottom: 1px solid #1a1a1a;
        }
        .cat-btn {
            background-color: #1f1f1f;
            color: #ccc;
            border: 1px solid #333;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            white-space: nowrap;
        }
        .cat-btn.active {
            background-color: #ff0055;
            color: #fff;
            border-color: #ff0055;
        }
        .container {
            padding: 20px;
        }
        .section-title {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: #eee;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .card {
            background-color: #141414;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #222;
        }
        .thumb {
            width: 100%;
            height: 170px;
            background-color: #222;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
            font-size: 0.9rem;
            position: relative;
        }
        .play-btn {
            position: absolute;
            width: 45px;
            height: 45px;
            background: rgba(255, 0, 85, 0.9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1.2rem;
        }
        .card-details {
            padding: 12px;
        }
        .card-title {
            font-size: 0.95rem;
            color: #fff;
            margin-bottom: 6px;
        }
        .card-info {
            font-size: 0.8rem;
            color: #777;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">NEO BLACK</div>
        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">Trending</a>
        </div>
    </header>

    <div class="categories">
        <button class="cat-btn active">All</button>
        <button class="cat-btn">Trending</button>
        <button class="cat-btn">Popular</button>
        <button class="cat-btn">New</button>
    </div>

    <div class="container">
        <h2 class="section-title">Latest Videos</h2>
        <div class="grid">
            <div class="card">
                <div class="thumb">
                    <div class="play-btn">▶</div>
                    Thumbnail Here
                </div>
                <div class="card-details">
                    <div class="card-title">Sample Video Title 1</div>
                    <div class="card-info">1080p • 12:45 min</div>
                </div>
            </div>

            <div class="card">
                <div class="thumb">
                    <div class="play-btn">▶</div>
                    Thumbnail Here
                </div>
                <div class="card-details">
                    <div class="card-title">Sample Video Title 2</div>
                    <div class="card-info">4K • 08:30 min</div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
