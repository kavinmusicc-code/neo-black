<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neo Black | Premium Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #0b0b0b;
            color: #ffffff;
            padding-bottom: 20px;
        }

        /* Pure CSS Toggle Trick for Warning Popup */
        #age-check {
            display: none;
        }
        #age-check:checked ~ .disclaimer-overlay {
            display: none;
        }

        /* 18+ Disclaimer Overlay */
        .disclaimer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.98);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            padding: 20px;
        }
        .disclaimer-box {
            background: #141414;
            border: 1px solid #222;
            padding: 30px 20px;
            border-radius: 12px;
            text-align: center;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .disclaimer-box h2 {
            color: #ff0055;
            margin-bottom: 15px;
            font-size: 1.5rem;
        }
        .disclaimer-box p {
            color: #aaa;
            font-size: 0.9rem;
            line-height: 1.5;
            margin-bottom: 20px;
        }
        .disclaimer-btns {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .btn-enter {
            background: #ff0055;
            color: #fff;
            border: none;
            padding: 12px 22px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            display: inline-block;
        }
        .btn-exit {
            background: #222;
            color: #aaa;
            border: 1px solid #333;
            padding: 12px 22px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.9rem;
            display: inline-block;
        }

        /* Header */
        header {
            background-color: #141414;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #222;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo {
            font-size: 1.4rem;
            font-weight: bold;
            color: #ff0055;
            letter-spacing: 1px;
        }
        .nav-links a {
            color: #aaa;
            text-decoration: none;
            margin-left: 15px;
            font-size: 0.9rem;
        }

        /* Categories */
        .categories {
            display: flex;
            gap: 10px;
            padding: 15px 20px;
            overflow-x: auto;
            border-bottom: 1px solid #1a1a1a;
        }
        .cat-btn {
            background-color: #1f1f1f;
            color: #ccc;
            border: 1px solid #333;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            white-space: nowrap;
        }
        .cat-btn.active {
            background-color: #ff0055;
            color: #fff;
            border-color: #ff0055;
        }

        /* Container & Grid */
        .container {
            padding: 20px;
        }
        .section-title {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: #eee;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .card {
            background-color: #141414;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #222;
        }
        .thumb {
            width: 100%;
            height: 170px;
            background-color: #222;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
            font-size: 0.9rem;
            position: relative;
        }
        .play-btn {
            position: absolute;
            width: 45px;
            height: 45px;
            background: rgba(255, 0, 85, 0.9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1.2rem;
        }
        .card-details {
            padding: 12px;
        }
        .card-title {
            font-size: 0.95rem;
            color: #fff;
            margin-bottom: 6px;
        }
        .card-info {
            font-size: 0.8rem;
            color: #777;
        }

        /* Footer Legal Links */
        footer {
            margin-top: 40px;
            padding: 20px;
            text-align: center;
            background-color: #141414;
            border-top: 1px solid #222;
        }
        .footer-links {
            margin-bottom: 10px;
        }
        .footer-links a {
            color: #888;
            text-decoration: none;
            margin: 0 10px;
            font-size: 0.8rem;
        }
        .footer-text {
            color: #555;
            font-size: 0.75rem;
        }
    </style>
</head>
<body>

    <!-- Hidden Checkbox Switch -->
    <input type="checkbox" id="age-check">

    <!-- 18+ Warning Overlay -->
    <div class="disclaimer-overlay">
        <div class="disclaimer-box">
            <h2>AGE RESTRICTION</h2>
            <p>This website contains adult content. You must be at least 18 years old or of legal age in your jurisdiction to enter.</p>
            <div class="disclaimer-btns">
                <label for="age-check" class="btn-enter">I AM 18 OR OLDER</label>
                <a href="https://www.google.com" class="btn-exit">EXIT</a>
            </div>
        </div>
    </div>

    <!-- Header -->
    <header>
        <div class="logo">NEO BLACK</div>
        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">Trending</a>
        </div>
    </header>

    <div
